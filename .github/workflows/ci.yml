name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The app itself is standard library only; ruff is the one tool CI installs.
      - name: Install ruff
        run: python -m pip install ruff==0.17.4
      - name: Lint
        run: ruff check .
      # The optional MLS integration reports a skip without its external controller.
      - name: Python and JavaScript tests
        run: python test.py
